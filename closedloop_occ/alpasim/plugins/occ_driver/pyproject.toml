[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim_occ"
version = "0.1.0"
description = "Occupancy-conditioned trajectory model plugin for AlpaSim (closed-loop occ->planning study)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alpasim_plugins",
    "alpasim_driver",
    "numpy",
]

# Register the occ model with the plugin system (driver resolves model_type='occ').
[project.entry-points."alpasim.models"]
occ = "alpasim_occ.occ_model:OccModel"

[tool.setuptools.packages.find]
include = ["alpasim_occ*"]

[tool.uv.sources]
alpasim_plugins = { workspace = true }
alpasim_driver = { workspace = true }
