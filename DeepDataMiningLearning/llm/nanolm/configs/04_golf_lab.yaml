# Stage 4 (lab scale) -- the golf baseline model on ONE GPU with a ~130M-token budget.
# All golf ablations (05_*, sweeps/golf_*.yaml) start from this file, so each technique is a diff
# against one fixed, reproducible baseline.
defaults: [04_golf_baseline.yaml]
name: golf_lab
train:
  batch_size: 16
  grad_accum: 4             # 65,536 tokens / step
  max_steps: 2000           # 131M tokens  (~1.3 shards: download --golf-shards 2)
  max_time_sec: 0           # step budget, not time: comparable across GPUs
  warmdown_frac: 0.25
  eval_every: 250
  eval_tokens: 524288
eval:
  final_eval_tokens: 4194304
  batch_size: 16
export:
  quant_bits: 8
  compressor: lzma
