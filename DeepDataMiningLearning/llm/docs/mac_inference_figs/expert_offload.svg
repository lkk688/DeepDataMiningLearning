<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="During decode each MoE layer computes routes whose experts are resident immediately, reads missing experts from SSD in parallel, installs them in slots, and then computes the rest." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>During decode each MoE layer computes routes whose experts are resident immediately, reads missing experts from SSD in parallel, installs them in slots, and then computes the rest.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">One MoE layer during decode with expert offload (oMLX)</text><rect x="40" y="70" width="130" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="105.0" y="91.25" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">router</text><text x="105.0" y="107.75" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">10 of 512</text><line x1="170" y1="95" x2="218" y2="95" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="60" width="170" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="305.0" y="91.25" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">split routes</text><text x="305.0" y="107.75" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">resident slot?</text><line x1="390" y1="80" x2="448" y2="80" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="419" y="72" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">hits</text><rect x="450" y="56" width="220" height="48" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="560.0" y="76.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">hits: compute on GPU now</text><text x="560.0" y="92.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">≈ 80 % of routes at 25 % residency</text><line x1="390" y1="112" x2="448" y2="168" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="405" y="168" font-size="12" fill="#57606a" text-anchor="end" font-weight="400">misses</text><rect x="450" y="150" width="220" height="64" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="560.0" y="170.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">pread from the safetensors shard</text><text x="560.0" y="186.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">12 threads, ≤ 48 in flight</text><text x="560.0" y="202.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">0.4–1.9 ms per 2.8 MB expert</text><line x1="670" y1="182" x2="718" y2="182" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="720" y="158" width="220" height="48" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="830.0" y="178.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">install into a free slot</text><text x="830.0" y="194.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">evict lowest decayed count</text><line x1="830" y1="158" x2="830" y2="108" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="840" y="136" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">compute the rest</text><line x1="670" y1="80" x2="718" y2="80" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="720" y="56" width="220" height="48" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="830.0" y="76.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">layer output</text><text x="830.0" y="92.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">→ next layer's router</text><rect x="40" y="250" width="900" height="104" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="60" y="276" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Measured on the M5 Pro (oMLX logs, per generated token, 48 layers):</text><text x="60" y="298" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">25 % resident: 74–92 expert misses → 200–250 MB read per token;  decode 15.5–17.8 tok/s (≈ 60 ms per token)</text><text x="60" y="318" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">50 % resident: 17–34 misses → 47–93 MB per token;  decode 23–28 tok/s (≈ 38 ms per token)</text><text x="60" y="338" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="400">SSD (random 2.8 MB reads, page cache bypassed): 7.3 GB/s with 1 thread, 17–18 GB/s with 12–24 threads. Reads only, no writes.</text><text x="40" y="384" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">If a read has not arrived within 0.5 ms, the GPU computes the resident routes first, so it does not sit idle (an idle Apple GPU also lowers its clock).</text></svg>
