<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="Gated residual: the hidden state is four residual streams; each block reads a gated average of the normalized streams and writes its output back to each stream with a learned scalar gate." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Gated residual: the hidden state is four residual streams; each block reads a gated average of the normalized streams and writes its output back to each stream with a learned scalar gate.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="960" height="372" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Gated residual: four residual streams, an element-wise read gate and a scalar write gate per stream</text><line x1="40" y1="70" x2="920" y2="70" stroke="#2a78d6" stroke-width="2.2"/><text x="30" y="74" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="400">H1</text><line x1="40" y1="96" x2="920" y2="96" stroke="#2a78d6" stroke-width="2.2"/><text x="30" y="100" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="400">H2</text><line x1="40" y1="122" x2="920" y2="122" stroke="#2a78d6" stroke-width="2.2"/><text x="30" y="126" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="400">H3</text><line x1="40" y1="148" x2="920" y2="148" stroke="#2a78d6" stroke-width="2.2"/><text x="30" y="152" font-size="12" fill="#2a78d6" text-anchor="end" font-weight="400">H4</text><text x="925" y="113" font-size="16" fill="#2a78d6" text-anchor="start" font-weight="400">→</text><line x1="170" y1="70" x2="170" y2="200" stroke="#8c959f" stroke-width="1.5"/><line x1="170" y1="96" x2="170" y2="200" stroke="#8c959f" stroke-width="1.5"/><line x1="170" y1="122" x2="170" y2="200" stroke="#8c959f" stroke-width="1.5"/><line x1="170" y1="148" x2="170" y2="200" stroke="#8c959f" stroke-width="1.5"/><rect x="110" y="202" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="170.0" y="220.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">RMSNorm</text><text x="170.0" y="236.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">n = Norm(H)</text><line x1="230" y1="224" x2="258" y2="224" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="260" y="196" width="190" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="355.0" y="220.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">read gate (low-rank 320)</text><text x="355.0" y="236.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">g = σ(W_up SiLU(W_down n / 4))</text><line x1="450" y1="224" x2="478" y2="224" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="202" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="555.0" y="220.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">x = ¼ Σ_s g_s ⊙ n_s</text><text x="555.0" y="236.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">one 2,560-dim input</text><line x1="630" y1="224" x2="658" y2="224" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="660" y="196" width="140" height="56" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="730.0" y="220.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">block</text><text x="730.0" y="236.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">DeltaNet / QSA / MoE</text><line x1="800" y1="224" x2="828" y2="224" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="814.0" y="218.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">y</text><rect x="830" y="196" width="110" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="885.0" y="220.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">write gates</text><text x="885.0" y="236.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">w_s = 2σ(·)</text><path d="M885,196 L885,74" fill="none" stroke="#57606a" stroke-width="1.6"/><text x="885" y="75" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="400">⊕</text><path d="M885,196 L885,100" fill="none" stroke="#57606a" stroke-width="1.6"/><text x="885" y="101" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="400">⊕</text><path d="M885,196 L885,126" fill="none" stroke="#57606a" stroke-width="1.6"/><text x="885" y="127" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="400">⊕</text><path d="M885,196 L885,152" fill="none" stroke="#57606a" stroke-width="1.6"/><text x="885" y="153" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="400">⊕</text><text x="875" y="184" font-size="12" fill="#57606a" text-anchor="end" font-weight="400">H_s += w_s · y</text><path d="M170,246 C170,300 880,300 885,254" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="520" y="316" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">the write gates are computed from the same normalized streams n</text><text x="40" y="340" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">Why: with one pre-norm stream every layer reads the same mixture. Widening to 4 streams already lowers loss (AltUp-style);</text><text x="40" y="356" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">the gates decide how each layer spends that width.</text></svg>
