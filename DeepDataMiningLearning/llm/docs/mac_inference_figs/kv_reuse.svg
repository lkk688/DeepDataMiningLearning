<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Prefix caching reuses KV only up to the first differing token; block caching also reuses later unchanged segments at a new position, which needs a position fix and a context fix, and is not possible for recurrent DeltaNet layers." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Prefix caching reuses KV only up to the first differing token; block caching also reuses later unchanged segments at a new position, which needs a position fix and a context fix, and is not possible for recurrent DeltaNet layers.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="980" height="520" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Reusing KV across requests: prefix caching vs. block (position-independent) caching</text><text x="40" y="82" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">request 1</text><rect x="190" y="60" width="144" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="262.0" y="81.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">tools</text><rect x="340" y="60" width="104" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="392.0" y="81.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">system</text><rect x="450" y="60" width="164" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="532.0" y="81.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">docs A</text><rect x="620" y="60" width="184" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="712.0" y="81.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">history</text><rect x="810" y="60" width="134" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="877.0" y="81.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">question 1</text><text x="40" y="126" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">request 2</text><rect x="190" y="104" width="144" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="262.0" y="125.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">tools</text><rect x="340" y="104" width="104" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="392.0" y="125.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">system</text><rect x="450" y="104" width="164" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="532.0" y="125.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">docs B</text><rect x="620" y="104" width="184" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="712.0" y="125.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">history</text><rect x="810" y="104" width="134" height="34" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="877.0" y="125.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">question 2</text><text x="190" y="158" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">Same tools, system prompt and history; only the retrieved documents differ.</text><text x="40" y="200" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Prefix caching</text><text x="40" y="218" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">(vLLM, SGLang, MLX-LM, oMLX, mlx-vlm APC, lithos-metal, Anthropic API)</text><text x="40" y="254" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">request 2</text><rect x="190" y="232" width="144" height="34" rx="5" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="262.0" y="253.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">tools</text><rect x="340" y="232" width="104" height="34" rx="5" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="392.0" y="253.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">system</text><rect x="450" y="232" width="164" height="34" rx="5" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="532.0" y="253.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">docs B</text><rect x="620" y="232" width="184" height="34" rx="5" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="712.0" y="253.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">history</text><rect x="810" y="232" width="134" height="34" rx="5" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="877.0" y="253.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">question 2</text><text x="190" y="286" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">Reuse stops at the first differing token: everything after docs B is recomputed, although 'history' is unchanged.</text><text x="40" y="330" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Block caching</text><text x="40" y="348" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">(Prompt Cache, CacheBlend / LMCache, EPIC, KVLink, …)</text><text x="40" y="384" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">request 2</text><rect x="190" y="362" width="144" height="34" rx="5" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="262.0" y="383.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">tools</text><rect x="340" y="362" width="104" height="34" rx="5" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="392.0" y="383.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">system</text><rect x="450" y="362" width="164" height="34" rx="5" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="532.0" y="383.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">docs B</text><rect x="620" y="362" width="184" height="34" rx="5" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="712.0" y="383.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">history</text><rect x="810" y="362" width="134" height="34" rx="5" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="877.0" y="383.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">question 2</text><text x="190" y="416" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">'history' reuses KV computed at another position. Three problems:</text><text x="206" y="438" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">1. position: keys were rotated for their old place → re-rotate by Δ (exact for RoPE: R(p+Δ) = R(Δ)R(p))</text><text x="206" y="458" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">2. context: those keys never attended to docs B → recompute a few tokens (CacheBlend) or train for it (KVLink, Block-Attention)</text><text x="206" y="478" font-size="12" fill="#d4561f" text-anchor="start" font-weight="400">3. for Gated DeltaNet layers there is no per-token KV: a recurrent state cannot be spliced at all</text><rect x="40" y="494" width="18" height="14" rx="3" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="64" y="506" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">reused</text><rect x="130" y="494" width="18" height="14" rx="3" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="154" y="506" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">recomputed</text></svg>
