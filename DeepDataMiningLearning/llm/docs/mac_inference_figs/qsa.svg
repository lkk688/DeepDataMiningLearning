<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Qwen Sparse Attention: indexer keys are average-pooled into 4-token blocks, each query scores the blocks, keeps the top 512 plus the unfinished tail, and runs attention only over those tokens." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Qwen Sparse Attention: indexer keys are average-pooled into 4-token blocks, each query scores the blocks, keeps the top 512 plus the unfinished tail, and runs attention only over those tokens.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Qwen Sparse Attention: score 4-token blocks, attend only to the best 512 of them</text><text x="40" y="66" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="400">① indexer key for every past token (1 head, d 128)</text><rect x="40" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="68" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="96" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="124" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="152" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="180" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="208" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="236" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="264" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="292" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="320" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="348" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="376" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="404" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="432" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="460" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="488" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="516" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="544" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="572" y="82" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="600" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="628" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="656" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="684" y="82" width="24" height="26" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><rect x="712" y="82" width="24" height="26" rx="4" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><rect x="740" y="82" width="24" height="26" rx="4" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><line x1="42" y1="112" x2="146" y2="112" stroke="#8c959f" stroke-width="1.5"/><line x1="94.0" y1="114" x2="94.0" y2="162" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="42" y="164" width="104" height="30" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="94.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_0</text><line x1="154" y1="112" x2="258" y2="112" stroke="#2a78d6" stroke-width="1.5"/><line x1="206.0" y1="114" x2="206.0" y2="162" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/><rect x="154" y="164" width="104" height="30" rx="5" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="206.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_1</text><line x1="266" y1="112" x2="370" y2="112" stroke="#8c959f" stroke-width="1.5"/><line x1="318.0" y1="114" x2="318.0" y2="162" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="266" y="164" width="104" height="30" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="318.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_2</text><line x1="378" y1="112" x2="482" y2="112" stroke="#8c959f" stroke-width="1.5"/><line x1="430.0" y1="114" x2="430.0" y2="162" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="378" y="164" width="104" height="30" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="430.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_3</text><line x1="490" y1="112" x2="594" y2="112" stroke="#2a78d6" stroke-width="1.5"/><line x1="542.0" y1="114" x2="542.0" y2="162" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/><rect x="490" y="164" width="104" height="30" rx="5" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="542.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_4</text><line x1="602" y1="112" x2="706" y2="112" stroke="#8c959f" stroke-width="1.5"/><line x1="654.0" y1="114" x2="654.0" y2="162" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="602" y="164" width="104" height="30" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="654.0" y="183.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">k̄_5</text><text x="712" y="126" font-size="12" fill="#13875b" text-anchor="start" font-weight="400">tail block</text><text x="40" y="216" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="400">② average-pool each block of r = 4 tokens into one key k̄_b, then RoPE at the block's start</text><rect x="800" y="158" width="130" height="42" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="865.0" y="183.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">query token i</text><text x="40" y="240" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="400">③ score every complete block:  I(i, b) = Σ over 4 heads of ReLU(⟨q_h,i , k̄_b⟩)</text><line x1="798" y1="179" x2="712" y2="179" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="755" y="171" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">scores</text><text x="40" y="274" font-size="12.5" fill="#57606a" text-anchor="start" font-weight="400">④ keep the top K / r = 512 blocks (K = 2,048 tokens) + the unfinished tail block</text><rect x="40" y="300" width="880" height="120" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="60" y="326" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">⑤ core attention (24 Q / 2 KV heads, d 256) runs only over the selected tokens</text><rect x="60" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="88" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="116" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="144" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="186" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="214" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="242" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="270" y="344" width="24" height="26" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><rect x="312" y="344" width="24" height="26" rx="4" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><rect x="340" y="344" width="24" height="26" rx="4" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="378" y="362" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">→ softmax(q·kᵀ/√d)·v → output</text><text x="60" y="400" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">Cost per query: indexer O(n / 4) + attention O(2,048) instead of O(n).  Report, at 1M tokens: attention 7.6× faster (prefill), 4.9× (decode).</text><text x="40" y="452" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">The indexer is trained by distilling the dense attention distribution (max-pooled to blocks) into the block scores, then fine-tuned with sparse attention.</text></svg>
