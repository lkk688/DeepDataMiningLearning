<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" role="img" aria-label="Qwen3.8-Flash-Next: 12 groups of three Gated DeltaNet layers and one Qwen Sparse Attention layer, each followed by a 512-expert MoE, over four gated residual streams, with an n-gram memory added at layer 2; experts and n-gram table can live on SSD." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Qwen3.8-Flash-Next: 12 groups of three Gated DeltaNet layers and one Qwen Sparse Attention layer, each followed by a 512-expert MoE, over four gated residual streams, with an n-gram memory added at layer 2; experts and n-gram table can live on SSD.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="980" height="720" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Qwen3.8-Flash-Next: 125B MoE (6B active), 4 residual streams, n-gram memory</text><rect x="40" y="60" width="170" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="125.0" y="84.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">text tokens</text><rect x="260" y="60" width="250" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="385.0" y="84.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">token embedding 248,320 × 2,560</text><line x1="210" y1="80" x2="258" y2="80" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="60" width="380" height="56" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="750.0" y="84.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">n-gram embedding: hashed bigrams + trigrams</text><text x="750.0" y="101.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">29.8 GiB table, 16 rows of 160 per token</text><path d="M125,100 C125,160 600,130 640,116" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="430" y="146" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">last 3 tokens → n-gram hash</text><line x1="385" y1="100" x2="385" y2="182" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="375" y="170" font-size="12" fill="#57606a" text-anchor="end" font-weight="400">copy into 4 streams</text><rect x="170" y="185" width="560" height="330" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="186" y="209" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">× 12 groups = 48 layers</text><line x1="196" y1="225" x2="196" y2="500" stroke="#2a78d6" stroke-width="2.2"/><line x1="206" y1="225" x2="206" y2="500" stroke="#2a78d6" stroke-width="2.2"/><line x1="216" y1="225" x2="216" y2="500" stroke="#2a78d6" stroke-width="2.2"/><line x1="226" y1="225" x2="226" y2="500" stroke="#2a78d6" stroke-width="2.2"/><text x="190" y="512" font-size="11" fill="#2a78d6" text-anchor="start" font-weight="400">4 streams × 2,560</text><rect x="250" y="225" width="440" height="92" rx="8" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="470" y="247" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">Gated DeltaNet → MoE</text><text x="470" y="267" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">each sublayer reads and writes the 4 streams</text><text x="470" y="283" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">through a gated residual</text><text x="470" y="303" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="400">layer 2 adds the n-gram memory</text><text x="700" y="275" font-size="14" fill="#13875b" text-anchor="start" font-weight="600">× 3</text><path d="M750,116 C790,160 760,280 692,295" fill="none" stroke="#d4561f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="772" y="210" font-size="12" fill="#d4561f" text-anchor="start" font-weight="400">gated add at layer 2</text><line x1="470" y1="317" x2="470" y2="345" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="347" width="440" height="76" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="470" y="371" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">Qwen Sparse Attention → MoE</text><text x="470" y="391" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">attends to ≤ 2,048 selected tokens (512 blocks of 4)</text><text x="470" y="409" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">24 Q / 2 KV heads, d 256; KV cache 24 KiB per token</text><text x="700" y="390" font-size="14" fill="#d4561f" text-anchor="start" font-weight="600">× 1</text><rect x="250" y="440" width="440" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="470" y="462" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">every MoE: router picks 10 of 512 experts (+1 shared)</text><text x="470" y="482" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">expert = SwiGLU 2,560 → 640 → 2,560, 2.8 MB at 4-bit</text><rect x="760" y="405" width="190" height="110" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="855" y="428" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="600">512 experts × 48 layers</text><text x="855" y="446" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="400">63.3 GiB</text><text x="855" y="464" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="400">a fraction stays in RAM,</text><text x="855" y="480" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="400">the rest is read from SSD</text><text x="855" y="496" font-size="12" fill="#d4561f" text-anchor="middle" font-weight="400">when routed</text><line x1="758" y1="470" x2="692" y2="470" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="470" y1="515" x2="470" y2="553" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="480" y="540" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">h_t</text><rect x="345" y="555" width="250" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="470.0" y="579.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">merge streams → LM head</text><line x1="470" y1="595" x2="470" y2="621" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="370" y="623" width="200" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="470.0" y="644.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">next token x_t+1</text><rect x="650" y="555" width="260" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="780.0" y="579.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">MTP head (1 layer, own MoE)</text><path d="M520,515 C580,530 620,540 648,566" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="780" y1="595" x2="780" y2="621" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="680" y="623" width="200" height="34" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="780.0" y="644.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">draft token x̂_t+2</text><rect x="40" y="600" width="18" height="14" rx="3" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="64" y="612" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">always in RAM: 5.9 GiB</text><rect x="40" y="624" width="18" height="14" rx="3" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="64" y="636" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">can live on SSD: 93 GiB</text><rect x="40" y="648" width="18" height="14" rx="3" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="64" y="660" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">fixed-size recurrent state</text><text x="40" y="700" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="400">Layer types and sizes from config.json; bytes from the oQ4e checkpoint's safetensors headers.</text></svg>
