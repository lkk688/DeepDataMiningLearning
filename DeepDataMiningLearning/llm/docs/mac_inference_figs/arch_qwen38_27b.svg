<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" role="img" aria-label="Qwen3.8-27B: 16 groups of three Gated DeltaNet layers and one full-attention layer, each followed by a dense MLP; an MTP head drafts the token after next." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>Qwen3.8-27B: 16 groups of three Gated DeltaNet layers and one full-attention layer, each followed by a dense MLP; an MTP head drafts the token after next.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="860" height="610" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Qwen3.8-27B: a dense hybrid, 64 layers, one residual stream</text><rect x="40" y="60" width="170" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="125.0" y="84.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">text tokens</text><rect x="40" y="120" width="170" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="125.0" y="144.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">image patches</text><rect x="260" y="60" width="250" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="385.0" y="84.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">token embedding</text><text x="385" y="116" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">248,320 × 5,120</text><rect x="260" y="130" width="250" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="385.0" y="154.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">vision encoder: 27 layers, 0.9 GB</text><line x1="210" y1="80" x2="258" y2="80" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="210" y1="140" x2="258" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><path d="M385,170 L385,206" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><path d="M510,80 C560,80 560,190 420,206" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="570" y="140" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">image features join the</text><text x="570" y="156" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">token sequence</text><rect x="200" y="210" width="370" height="240" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="216" y="234" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">× 16 groups = 64 layers</text><rect x="225" y="250" width="320" height="70" rx="8" fill="#e5f5ee" stroke="#13875b" stroke-width="1.5"/><text x="385.0" y="281.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">Gated DeltaNet (linear attention)</text><text x="385.0" y="298.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">→ dense SwiGLU MLP, 17,408</text><text x="535" y="290" font-size="14" fill="#13875b" text-anchor="end" font-weight="600">× 3</text><line x1="385" y1="320" x2="385" y2="352" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="225" y="355" width="320" height="70" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="385.0" y="386.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">gated full attention: 24 Q / 4 KV heads, d 256</text><text x="385.0" y="403.18" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">→ dense SwiGLU MLP, 17,408</text><text x="535" y="395" font-size="14" fill="#d4561f" text-anchor="end" font-weight="600">× 1</text><line x1="545" y1="285" x2="600" y2="285" stroke="#13875b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="606" y="280" font-size="12" fill="#13875b" text-anchor="start" font-weight="600">keeps a fixed-size state:</text><text x="606" y="296" font-size="12" fill="#13875b" text-anchor="start" font-weight="400">48 heads × 128 × 128, fp32</text><text x="606" y="312" font-size="12" fill="#13875b" text-anchor="start" font-weight="400">0.154 GB for all 48 layers</text><line x1="545" y1="390" x2="600" y2="390" stroke="#d4561f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="606" y="385" font-size="12" fill="#d4561f" text-anchor="start" font-weight="600">keeps a KV cache that grows:</text><text x="606" y="401" font-size="12" fill="#d4561f" text-anchor="start" font-weight="400">16 layers × 2 × 4 × 256 × 2 B</text><text x="606" y="417" font-size="12" fill="#d4561f" text-anchor="start" font-weight="400">= 64 KiB per token</text><line x1="385" y1="450" x2="385" y2="488" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="395" y="474" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">h_t</text><rect x="260" y="490" width="250" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="385.0" y="514.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">RMSNorm → LM head 248,320</text><line x1="385" y1="530" x2="385" y2="556" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="285" y="558" width="200" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="385.0" y="579.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">next token x_t+1</text><rect x="590" y="490" width="230" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="705.0" y="514.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">MTP head: 1 attention layer</text><path d="M420,450 C470,470 540,470 588,500" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><path d="M485,575 C540,575 560,545 600,532" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="552" y="476" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">h_t</text><text x="500" y="592" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">x_t+1</text><line x1="705" y1="530" x2="705" y2="556" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="605" y="558" width="200" height="34" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="705.0" y="579.68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="400">draft token x̂_t+2</text></svg>
