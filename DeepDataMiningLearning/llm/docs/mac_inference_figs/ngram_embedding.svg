<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="N-gram embedding: the bigram and trigram ending at each token are hashed into 16 heads with prime moduli, 16 rows are read from a 51-billion-parameter table, and the result is gated by the hidden state and added at layer 2." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title>N-gram embedding: the bigram and trigram ending at each token are hashed into 16 heads with prime moduli, 16 rows are read from a 51-billion-parameter table, and the result is gated by the hidden state and added at layer 2.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="1080" height="470" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">N-gram embedding: hash the last 2–3 tokens, look up 16 rows, gate them into layer 2</text><rect x="60" y="64" width="76" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="98.0" y="85.5" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">x_t−2</text><rect x="150" y="64" width="76" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="188.0" y="85.5" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">x_t−1</text><rect x="240" y="64" width="76" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="278.0" y="85.5" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="400">x_t</text><rect x="40" y="140" width="150" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="115.0" y="164.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">bigram (x_t−1, x_t)</text><rect x="205" y="140" width="200" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="305.0" y="164.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">trigram (x_t−2, x_t−1, x_t)</text><line x1="188" y1="98" x2="140" y2="138" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="248" y1="98" x2="290" y2="138" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="445" y="125" width="210" height="70" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="550.0" y="148.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">hash</text><text x="550.0" y="164.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">⊕ of x_j × odd multiplier m_j</text><text x="550.0" y="180.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">(64-bit, seeded per layer)</text><path d="M115,180 L115,215 L470,215 L470,197" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="405" y1="160" x2="443" y2="160" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="60" width="180" height="230" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="780" y="82" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">16 hash heads</text><text x="780" y="100" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">2 orders × 8 heads</text><rect x="702" y="112" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="126.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">head 1: mod p_1</text><rect x="702" y="138" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="152.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">head 2: mod p_2</text><rect x="702" y="164" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="178.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">head 3: mod p_3</text><rect x="702" y="190" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="204.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">head 4: mod p_4</text><rect x="702" y="216" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="230.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">head 5: mod p_5</text><rect x="702" y="242" width="156" height="20" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="780.0" y="256.14" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">…  head 16: mod p_16</text><line x1="655" y1="160" x2="688" y2="160" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="780" y="280" font-size="11.5" fill="#57606a" text-anchor="middle" font-weight="400">p_h: distinct primes ≈ 20 M</text><rect x="900" y="60" width="160" height="120" rx="8" fill="#fdeee7" stroke="#d4561f" stroke-width="1.5"/><text x="980.0" y="100.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">n-gram table</text><text x="980.0" y="116.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">≈ 320 M rows × 160</text><text x="980.0" y="132.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">51 B params, 29.8 GiB</text><text x="980.0" y="148.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">on SSD: read 16 rows</text><line x1="870" y1="205" x2="940" y2="182" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="878" y="226" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">16 row ids</text><line x1="980" y1="180" x2="980" y2="238" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="990" y="212" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">16 × 160 values</text><rect x="900" y="240" width="160" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="980.0" y="264.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">concat → e (2,560)</text><rect x="40" y="330" width="250" height="56" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="165.0" y="354.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">query: hidden state of</text><text x="165.0" y="370.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">each stream at layer 2</text><rect x="340" y="320" width="300" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="490.0" y="346.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">gate per stream</text><text x="490.0" y="362.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">σ( signed-√(⟨W_k e, q_s⟩ / √d) )</text><text x="490.0" y="378.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">× value W_v e</text><path d="M980,280 C980,305 760,305 642,345" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><line x1="290" y1="358" x2="338" y2="358" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="330" width="370" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="875.0" y="354.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">+ short conv (kernel 4, dilation 3)</text><text x="875.0" y="370.32" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">→ added to the 4 residual streams</text><line x1="640" y1="368" x2="688" y2="368" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="40" y="430" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">Per token: no matrix work for the lookup, 16 row reads of ≈ 90 bytes at addresses known from the tokens alone,</text><text x="40" y="448" font-size="12" fill="#57606a" text-anchor="start" font-weight="400">so the table can sit in host memory or on SSD and be prefetched while layer 1 runs.</text></svg>
